<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="url(#grad)"/>

  <!-- Clipboard background -->
  <rect x="20" y="25" width="60" height="60" rx="5" fill="white"/>

  <!-- Checkmarks -->
  <g stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- First checkmark (completed) -->
    <g stroke="#667eea">
      <polyline points="28,40 35,47 48,34"/>
    </g>
    <!-- Second checkmark (completed) -->
    <g stroke="#667eea">
      <polyline points="28,58 35,65 48,52"/>
    </g>
    <!-- Third line (incomplete) -->
    <line x1="28" y1="75" x2="72" y2="75" stroke="#ccc" stroke-width="4"/>
  </g>
</svg>
