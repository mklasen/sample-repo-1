<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icon Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            text-align: center;
        }
        canvas {
            border: 1px solid #ddd;
            margin: 10px;
        }
        button {
            padding: 10px 20px;
            margin: 10px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #5568d3;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>PWA Icon Generator</h1>
        <p>Click the buttons below to download the required icon sizes.</p>

        <canvas id="canvas192" width="192" height="192"></canvas>
        <canvas id="canvas512" width="512" height="512"></canvas>

        <br>
        <button onclick="generateIcon(192)">Download 192x192 Icon</button>
        <button onclick="generateIcon(512)">Download 512x512 Icon</button>
    </div>

    <script>
        function drawIcon(canvas) {
            const ctx = canvas.getContext('2d');
            const size = canvas.width;

            // Create gradient background
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#667eea');
            gradient.addColorStop(1, '#764ba2');

            // Draw rounded rectangle background
            const radius = size * 0.2;
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.moveTo(radius, 0);
            ctx.lineTo(size - radius, 0);
            ctx.quadraticCurveTo(size, 0, size, radius);
            ctx.lineTo(size, size - radius);
            ctx.quadraticCurveTo(size, size, size - radius, size);
            ctx.lineTo(radius, size);
            ctx.quadraticCurveTo(0, size, 0, size - radius);
            ctx.lineTo(0, radius);
            ctx.quadraticCurveTo(0, 0, radius, 0);
            ctx.closePath();
            ctx.fill();

            // Draw white clipboard background
            ctx.fillStyle = 'white';
            ctx.fillRect(size * 0.2, size * 0.25, size * 0.6, size * 0.6);

            // Draw checkmarks
            ctx.strokeStyle = '#667eea';
            ctx.lineWidth = size * 0.08;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            // First checkmark
            ctx.beginPath();
            ctx.moveTo(size * 0.28, size * 0.40);
            ctx.lineTo(size * 0.35, size * 0.47);
            ctx.lineTo(size * 0.48, size * 0.34);
            ctx.stroke();

            // Second checkmark
            ctx.beginPath();
            ctx.moveTo(size * 0.28, size * 0.58);
            ctx.lineTo(size * 0.35, size * 0.65);
            ctx.lineTo(size * 0.48, size * 0.52);
            ctx.stroke();

            // Incomplete line
            ctx.strokeStyle = '#ccc';
            ctx.lineWidth = size * 0.04;
            ctx.beginPath();
            ctx.moveTo(size * 0.28, size * 0.75);
            ctx.lineTo(size * 0.72, size * 0.75);
            ctx.stroke();
        }

        function generateIcon(size) {
            const canvas = document.getElementById('canvas' + size);
            drawIcon(canvas);

            canvas.toBlob(function(blob) {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `icon-${size}.png`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            });
        }

        // Draw icons on page load
        window.onload = function() {
            drawIcon(document.getElementById('canvas192'));
            drawIcon(document.getElementById('canvas512'));
        };
    </script>
</body>
</html>
