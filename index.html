<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>

    <!-- PWA Meta Tags -->
    <meta name="description" content="A modern todo app with LocalStorage and IndexedDB support">
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Todo App">

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="manifest" href="manifest.json">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Todo App</h1>
            <div class="storage-toggle">
                <label>
                    <input type="radio" name="storage" value="localStorage" checked>
                    <span>LocalStorage</span>
                </label>
                <label>
                    <input type="radio" name="storage" value="indexedDB">
                    <span>IndexedDB</span>
                </label>
            </div>
        </header>

        <div class="add-todo">
            <input type="text" id="todoInput" placeholder="Add a new todo..." />
            <button id="addBtn">Add</button>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <ul id="todoList" class="todo-list"></ul>

        <div class="stats">
            <span id="stats"></span>
            <button id="clearCompleted">Clear Completed</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
